name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ha-cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ha-cli
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt pytest aiohttp pyflakes
      - run: python -m pyflakes ha.py ha_lib tests
      - run: python -m pytest -q
